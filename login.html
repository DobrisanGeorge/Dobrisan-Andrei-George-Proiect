<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Neon Studio</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<header>
    <div class="logo">NEON STUDIO</div>
    <nav>
        <ul>
            <li><a href="index.html">Acasă</a></li>
            <li><a href="portofoliu.html">Portofoliu</a></li>
            <li><a href="store.html">Store</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>
    <div class="user-icon-container">
        <div class="user-icon">👤</div>
        <div class="user-dropdown">
            <a href="#">Profil</a>
            <a href="#">Setări</a>
            <a href="#">Logout</a>
        </div>
    </div>
</header>

<section class="form-container">
    <div class="form-box">
        <h2>Autentificare</h2>
        <form>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Parolă" required>
            <button type="submit">Login</button>
        </form>
        <p>Nu ai cont? <a href="#register" id="show-register">Creează cont</a></p>
    </div>

    <div class="form-box" id="register" style="display:none;">
        <h2>Creare cont</h2>
        <form>
            <input type="text" placeholder="Nume complet" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Parolă" required>
            <button type="submit">Înregistrează-te</button>
        </form>
        <p>Ai deja cont? <a href="#login" id="show-login">Autentificare</a></p>
    </div>
</section>

<footer>
    © 2025 Neon Studio — Toate drepturile rezervate.
</footer>

<script>
    const showRegister = document.getElementById('show-register');
    const showLogin = document.getElementById('show-login');
    const registerBox = document.getElementById('register');
    const loginBox = document.querySelector('.form-box:not(#register)');

    showRegister.addEventListener('click', () => {
        loginBox.style.display = 'none';
        registerBox.style.display = 'block';
    });
    showLogin.addEventListener('click', () => {
        loginBox.style.display = 'block';
        registerBox.style.display = 'none';
    });
</script>

</body>
</html>
