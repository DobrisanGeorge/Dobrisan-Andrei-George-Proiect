<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Neon Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="top">

<header>
    <div class="container header-content">
        <a href="index.html" class="logo">NEON STUDIO</a>
        <nav id="mainNav">
            <ul>
                <li><a href="index.html">Acasă</a></li>
                <li><a href="portofoliu.html">Portofoliu</a></li>
                <li><a href="plugins.html">Plugins</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <button class="hamburger" id="hamburger" aria-label="Meniu">
            <span></span><span></span><span></span>
        </button>
        <div class="user-icon-container">
            <div class="user-icon">👤</div>
            <div class="user-dropdown">
                <a href="login.html" class="active">Login / Creează Cont</a>
                <a href="profil.html">Profil</a>
                <a href="setari.html">Setări</a>
                <a href="#">Logout</a>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="form-container">
        <div class="form-box">
            <h2>Autentificare</h2>
            <form>
                <label for="login-email" style="display:none;">Email</label>
                <input type="email" id="login-email" placeholder="Email" required>

                <label for="login-password" style="display:none;">Parolă</label>
                <input type="password" id="login-password" placeholder="Parolă" required>

                <button type="submit" class="btn btn-purple">Login</button>
            </form>
            <p>Nu ai cont? <a href="#" id="show-register">Creează cont</a></p>
        </div>

        <div class="form-box" id="register" style="display:none;">
            <h2>Creare cont</h2>
            <form>
                <label for="register-name" style="display:none;">Nume complet</label>
                <input type="text" id="register-name" placeholder="Nume complet" required>

                <label for="register-email" style="display:none;">Email</label>
                <input type="email" id="register-email" placeholder="Email" required>

                <label for="register-password" style="display:none;">Parolă</label>
                <input type="password" id="register-password" placeholder="Parolă" required>

                <button type="submit" class="btn btn-purple">Înregistrează-te</button>
            </form>
            <p>Ai deja cont? <a href="#" id="show-login">Autentificare</a></p>
        </div>
    </section>
</main>

<footer>
    © 2025 Neon Studio — Toate drepturile rezervate.
</footer>

<button id="backToTop" aria-label="Mergi sus">⬆️</button>

<script src="script.js"></script>
</body>
</html>
